[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yemenjpt-api"
version = "0.1.0"
description = "YemenJPT API — intelligence backend for Yemeni political analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    # Database
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    "pgvector==0.3.5",
    # Validation & settings
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "email-validator==2.2.0",
    # Auth
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.31",
    # HTTP client
    "httpx==0.27.2",
    # Graph analysis
    "networkx==3.4.1",
    # Numerics
    "numpy==1.26.4",
    # Utils
    "python-dateutil==2.9.0",
    "structlog==24.4.0",
    "tenacity==9.0.0",
    "orjson==3.11.6",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers==3.1.1",
    "torch==2.13.0",
]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "factory-boy==3.3.1",
    "faker==30.3.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yemenjpt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 88
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
