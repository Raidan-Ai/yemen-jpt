version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: yemenjpt
      POSTGRES_PASSWORD: yemenjpt_dev
      POSTGRES_DB: yemenjpt
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yemenjpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - apps/api/.env.example
    environment:
      - DATABASE_URL=postgresql+asyncpg://yemenjpt:yemenjpt_dev@postgres:5432/yemenjpt
      - MODEL_PROVIDER=mock
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/src:ro
      - ./packages/contracts/src:/app/contracts/src:ro

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api

volumes:
  pg_data: